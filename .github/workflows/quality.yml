name: Quality
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and production build
        run: npm run build
      - name: Verify both HTML entrypoints
        run: test -f dist/index.html && test -f dist/workspace.html
